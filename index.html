<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Z-lift</title>
 
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Z-lift" />
  <meta name="theme-color" content="#0e0e0e" />
  <link rel="apple-touch-icon" href="icon-192.png" />
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
 
  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    /* ── TOKENS ── */
    :root {
      --bg:         #f7f6f2;
      --bg2:        #ffffff;
      --bg3:        #eeede9;
      --bg4:        #e4e3de;
      --text:       #1a1a18;
      --text2:      #6b6b67;
      --text3:      #9b9b96;
      --accent:     #6abf00;
      --accent2:    #559900;
      --accent-dim: rgba(106,191,0,0.1);
      --border:     rgba(0,0,0,0.08);
      --border2:    rgba(0,0,0,0.16);
      --red:        #dc2626;
      --red-dim:    rgba(220,38,38,0.1);
      --blue:       #2563eb;
      --blue-dim:   rgba(37,99,235,0.1);
      --gold:       #b45309;
      --gold-dim:   rgba(180,83,9,0.1);
      --radius:     14px;
      --radius-sm:  8px;
      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }
 
    :root.dark {
      --bg:         #0e0e0e;
      --bg2:        #161616;
      --bg3:        #1e1e1e;
      --bg4:        #252525;
      --text:       #f0ede4;
      --text2:      #888880;
      --text3:      #555550;
      --accent:     #c8f535;
      --accent2:    #a8d520;
      --accent-dim: rgba(200,245,53,0.12);
      --border:     rgba(255,255,255,0.06);
      --border2:    rgba(255,255,255,0.12);
      --red:        #ff4d4d;
      --red-dim:    rgba(255,77,77,0.12);
      --blue:       #5b8fff;
      --blue-dim:   rgba(91,143,255,0.12);
      --gold:       #d4960a;
      --gold-dim:   rgba(245,200,66,0.12);
    }
 
    /* ── BASE ── */
    body {
      font-family: var(--font-display);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
 
    /* ── LAYOUT ── */
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 1rem calc(8rem + env(safe-area-inset-bottom));
    }
 
    /* ── HEADER ── */
    .header {
      padding: 2rem 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
    }
    .theme-btn {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.5px solid var(--border2);
      border-radius: 50%;
      background: var(--bg3);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s;
    }
    .theme-btn:hover { background: var(--bg4); transform: rotate(20deg); }
 
    /* ── DAY NAV ── */
    .days-nav {
      display: grid;
      grid-template-columns: repeat(var(--day-cols, 3), 1fr);
      gap: 6px;
      margin-bottom: 1.75rem;
    }
    .day-btn-wrap { position: relative; display: flex; align-items: center; }
    .day-btn {
      padding: 8px 4px;
      border-radius: 10px;
      border: 0.5px solid var(--border2);
      background: rgba(255,255,255,0.07);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-display);
      letter-spacing: 0.02em;
      transition: all 0.15s;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      height: 36px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .day-btn.active {
      background: rgba(255,255,255,0.92);
      color: #0e0e0e;
      border-color: rgba(255,255,255,0.92);
    }
    .day-btn:hover:not(.active) { background: rgba(255,255,255,0.13); }
 
    .day-edit-icon {
      position: absolute;
      right: -3px;
      top: -3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      font-size: 8px;
      color: var(--text3);
      line-height: 1;
    }
    .day-btn-wrap:hover .day-edit-icon { opacity: 1; }
 
    .add-day-btn {
      padding: 8px 4px;
      border-radius: 10px;
      border: 0.5px dashed var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      color: var(--text3);
      line-height: 1;
      font-family: var(--font-display);
      transition: all 0.15s;
      text-align: center;
      width: 100%;
      height: 36px;
    }
    .add-day-btn:hover { background: var(--bg2); border-color: var(--border2); color: var(--text2); }
 
    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: var(--font-mono);
    }
    .section-count {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--font-mono);
    }
 
    /* ── EXERCISE CARD ── */
    .exercise-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
      touch-action: pan-y;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }
    .exercise-card:hover { border-color: var(--border2); }
    .exercise-card.editing {
      border-color: rgba(200,245,53,0.3);
      box-shadow: 0 0 0 1px rgba(200,245,53,0.08), 0 4px 24px rgba(0,0,0,0.4);
    }
    @keyframes flashSave {
      0%   { box-shadow: 0 0 0 2px var(--accent); }
      100% { box-shadow: none; }
    }
    .exercise-card.flash-saved { animation: flashSave 0.6s ease-out; }
 
    /* Drag states */
    .exercise-card.drag-lifted {
      opacity: 0.92;
      transform: scale(1.025) rotate(0.6deg);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 1.5px rgba(255,255,255,0.7);
      border-color: rgba(255,255,255,0.7);
      z-index: 10;
      position: relative;
    }
    .exercise-card.dragging {
      opacity: 0.25;
      transform: scale(0.97);
      border-style: dashed;
      border-color: var(--border2);
      box-shadow: none;
    }
    .exercise-card.drag-over {
      border-color: rgba(255,255,255,0.6);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.6), inset 0 0 0 2px rgba(255,255,255,0.06);
      transform: scaleX(1.01);
    }
 
    .ex-main {
      padding: 14px 16px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ex-main:active { cursor: grabbing; }
    .exercise-card button,
    .exercise-card input { cursor: auto; }
 
    .ex-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .ex-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ex-name input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-display);
      outline: none;
    }
    .ex-right {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
    }
 
    /* ── BADGES ── */
    .badge {
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 6px;
      white-space: nowrap;
      font-weight: 500;
      font-family: var(--font-mono);
    }
    .badge.series { background: var(--blue-dim);   color: var(--blue); }
    .badge.reps   { background: var(--accent-dim); color: var(--accent); }
    .badge.rest   { background: var(--gold-dim);   color: var(--gold); }
 
    .last-weight {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text3);
      flex-shrink: 0;
    }
    .last-weight.has-data { color: var(--accent2); }
 
    /* ── EDIT BUTTON ── */
    .edit-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.5px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
    }
    .edit-btn:hover { background: var(--bg3); color: var(--text2); border-color: var(--border2); }
    .exercise-card.editing .edit-btn {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(200,245,53,0.3);
    }
 
    /* ── DETAILS PANEL ── */
    .ex-details {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
      overflow: hidden;
    }
    .ex-details-inner {
      min-height: 0;
      border-top: 0.5px solid transparent;
      padding: 0 16px 0;
      transition: border-color 0.25s ease, padding 0.25s ease;
    }
    .exercise-card.open .ex-details { grid-template-rows: 1fr; }
    .exercise-card.open .ex-details-inner {
      border-top-color: var(--border);
      padding: 0 16px 16px;
    }
 
    .details-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 0 12px;
    }
    .tab-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text3);
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--bg4); color: var(--text2); border-color: var(--border2); }
 
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
 
    /* Settings tab */
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .field-group label, .notes-field label {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--font-mono);
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field-group input, .notes-field input {
      width: 100%;
      padding: 7px 9px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg3);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.15s;
    }
    .field-group input:focus, .notes-field input:focus { border-color: rgba(200,245,53,0.4); background: var(--bg4); }
 
    .notes-field { margin-bottom: 12px; }
 
    /* Weight tracking tab */
    .weight-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .weight-log-header {
      display: grid;
      grid-template-columns: 90px 1fr 80px 32px;
      gap: 6px;
      padding-bottom: 6px;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 4px;
    }
    .weight-log-header span {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .weight-entry {
      display: grid;
      grid-template-columns: 90px 1fr 80px 32px;
      gap: 6px;
      align-items: center;
    }
    .weight-entry input {
      width: 100%;
      padding: 6px 9px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: var(--bg3);
      color: var(--text);
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.15s;
    }
    .weight-entry input:focus { border-color: rgba(200,245,53,0.4); }
    .weight-entry input.date-field  { color: var(--text3); font-size: 11px; }
    .weight-entry input.notes-mini  { font-size: 11px; }
    .weight-entry .rm-weight {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      color: var(--text3);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .weight-entry .rm-weight:hover { background: var(--red-dim); color: var(--red); border-color: var(--red); }
 
    .add-weight-btn {
      width: 100%;
      padding: 7px;
      border: 0.5px dashed var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text3);
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 12px;
    }
    .add-weight-btn:hover { background: var(--bg3); color: var(--text2); border-color: var(--border2); }
 
    .del-btn {
      font-size: 11px;
      color: var(--red);
      cursor: pointer;
      background: var(--red-dim);
      border: 0.5px solid transparent;
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-family: var(--font-mono);
      transition: all 0.15s;
      margin-top: 4px;
      display: inline-block;
    }
    .del-btn:hover { background: rgba(220,38,38,0.2); border-color: var(--red); }
 
    /* ── MINI CHART ── */
    .progress-chart { height: 48px; position: relative; margin-bottom: 4px; }
    .progress-chart canvas { width: 100%; height: 100%; }
    .chart-empty {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--font-mono);
      padding: 14px 0;
      text-align: center;
    }
 
    /* ── ADD EXERCISE BUTTON ── */
    .add-btn {
      width: 100%;
      padding: 11px;
      border: 0.5px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text3);
      font-size: 13px;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.15s;
    }
    .add-btn:hover { background: var(--bg2); border-color: var(--border2); color: var(--text2); }
 
    /* ── START SESSION BUTTON ── */
    .start-session-btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius);
      border: 0.5px solid rgba(255,255,255,0.2);
      background: #1a1a18;
      color: #f7f6f2;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-display);
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.15s;
    }
    .start-session-btn:hover { background: #333; }
    :root.dark .start-session-btn { background: rgba(255,255,255,0.92); color: #0e0e0e; }
    :root.dark .start-session-btn:hover { background: #ffffff; }
 
    /* ── MODAL ── */
    @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
 
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.15s ease;
    }
    .modal {
      background: var(--bg2);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 360px;
      animation: slideUp 0.15s ease;
    }
    .modal-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--font-mono);
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-field input {
      width: 100%;
      padding: 8px 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg3);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-display);
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal-field input:focus { border-color: rgba(200,245,53,0.4); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-btn {
      flex: 1;
      padding: 9px;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border2);
      font-size: 13px;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-btn.primary   { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
    .modal-btn.primary:hover { background: var(--accent2); }
    .modal-btn.secondary { background: transparent; color: var(--text2); }
    .modal-btn.secondary:hover { background: var(--bg3); }
    .modal-btn.danger    { background: var(--red-dim); color: var(--red); border-color: transparent; }
    .modal-btn.danger:hover { background: rgba(255,77,77,0.2); }
    .modal-sep { height: 0.5px; background: var(--border); margin: 12px 0; }
 
    /* ── SESSION OVERLAY ── */
    .session-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      animation: fadeIn 0.2s ease;
    }
    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.2rem 0.8rem;
      border-bottom: 0.5px solid var(--border);
    }
    .session-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .session-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      border: none;
      color: var(--text2);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .session-steps {
      display: flex;
      gap: 4px;
      padding: 8px 1.2rem 0;
    }
    .session-step {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border2);
      transition: background 0.3s ease;
    }
    .session-step.done { background: var(--accent2); }
    .session-step.current { background: var(--accent); }
    .session-next-ex {
      font-size: 12px;
      color: var(--text3);
      font-family: var(--font-mono);
      text-align: center;
      letter-spacing: 0.02em;
    }
    .session-next-ex span { color: var(--text2); }
    .session-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 1.5rem;
    }
    .session-ex-num {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .session-ex-name {
      font-size: 30px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .session-badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .session-badge {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-weight: 500;
    }
    .session-badge.series { background: var(--blue-dim);   color: var(--blue); }
    .session-badge.reps   { background: var(--accent-dim); color: var(--accent); }
    .session-badge.rest   { background: var(--gold-dim);   color: var(--gold); }
    .session-notes {
      font-size: 13px;
      color: var(--text3);
      font-family: var(--font-mono);
      text-align: center;
      font-style: italic;
    }
 
    /* Series counter */
    .session-series-counter {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
    }
    .series-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .series-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      background: transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .series-dot.done {
      background: var(--text);
      border-color: var(--text);
    }
    .series-counter-label {
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 0.05em;
      min-width: 60px;
    }

    /* Timer */
    .session-timer { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .timer-ring { position: relative; width: 140px; height: 140px; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring circle { fill: none; }
    .timer-ring .track { stroke: var(--border2); stroke-width: 4; }
    .timer-ring .prog  { stroke: var(--text2); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
    .timer-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-count { font-size: 36px; font-weight: 800; font-family: var(--font-mono); color: var(--text); letter-spacing: -0.03em; }
    .timer-label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }
    .timer-idle  { font-size: 13px; color: var(--text3); font-family: var(--font-mono); }
 
    .session-actions { display: flex; gap: 10px; width: 100%; }
    .session-btn {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border2);
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-display);
      cursor: pointer;
      transition: all 0.15s;
    }
    .session-btn.secondary { background: var(--bg3); color: var(--text2); }
    .session-btn.secondary:hover { background: var(--bg4); }
    .session-btn.next { background: var(--bg4); color: var(--text); border-color: var(--border2); }
    .session-btn.next:hover { background: #333; color: #fff; }
    :root.dark .session-btn.next { background: #333; color: var(--text); }
    :root.dark .session-btn.next:hover { background: #444; }
 
    .session-nav { display: flex; gap: 8px; padding: 0 1.2rem 1rem; }
    .session-nav-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border);
      background: var(--bg2);
      color: var(--text3);
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
    }
    .session-nav-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text2); }
    .session-nav-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
      background: var(--bg);
      border-top: 0.5px solid var(--border2);
    }
    .bottom-nav-inner {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      padding: 10px 0;
    }
    .bottom-nav-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border2);
      background: var(--bg3);
      color: var(--text3);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      line-height: 1;
    }
    .bottom-nav-btn .nav-icon { font-size: 16px; }
    .bottom-nav-btn:hover { background: var(--bg4); color: var(--text2); }
    .bottom-nav-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(200,245,53,0.25);
    }
    :root:not(.dark) .bottom-nav-btn.active {
      background: #1a1a18;
      color: #f7f6f2;
      border-color: #1a1a18;
    }
  </style>
</head>
<body>
 
<div class="app">

<!-- Session overlay -->

    <div class="session-next-ex" id="sessionNextEx"></div>
    <div class="session-timer" id="sessionTimerZone">
      <div class="timer-ring" id="timerRing" style="display:none">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="track" cx="70" cy="70" r="64"/>

            stroke-dasharray="402.12" stroke-dashoffset="0"/>
        </svg>

</div>
 
<!-- Day edit modal -->
<div class="modal-overlay" id="dayModal" style="display:none" onclick="closeDayModal(event)">
  <div class="modal" onclick="event.stopPropagation()">

      <input id="dayModalName" type="text" placeholder="ex: Pecs / Triceps" onkeydown="if(event.key==='Enter')saveDayModal()" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeDayModal()">Annuler</button>
      <button class="modal-btn primary"   onclick="saveDayModal()">Enregistrer</button>

      <button class="modal-btn danger" onclick="deleteDayModal()">Supprimer ce groupe</button>

</div>
 
<script>
// ── DEFAULT DATA — GYM ───────────────────────────────────
const DEFAULT_DATA = {
  "Épaules / Abdos": {

      { id: 14, name: "Face pull",               series: "4", reps: "15",     rest: "60 s", notes: "", weights: [] },
      { id: 15, name: "Curl barre EZ",           series: "4", reps: "10",     rest: "90 s", notes: "", weights: [] },

    ]
  },
  "Pecs / Triceps": {
    groupe: "Pecs / Triceps",
    exercises: [
      { id: 1,  name: "Développé couché",          series: "4", reps: "8–10",   rest: "90 s", notes: "", weights: [] },
      { id: 2,  name: "Développé incliné",          series: "4", reps: "10–12",  rest: "90 s",  notes: "", weights: [] },
      { id: 3,  name: "Butterfly",                  series: "4", reps: "12–15",  rest: "60 s",  notes: "", weights: [] },
      { id: 4,  name: "Dips (poids corps/assisté)", series: "4", reps: "Max",    rest: "90 s",  notes: "", weights: [] },
      { id: 5,  name: "Extensions triceps corde",   series: "4", reps: "12",     rest: "60 s",  notes: "", weights: [] },
      { id: 22, name: "Extension haltère nuque",     series: "4", reps: "10–12",  rest: "90 s",  notes: "", weights: [] },
      { id: 27, name: "Running",                      series: "1", reps: "10 min", rest: "0 s",   notes: "", weights: [] },
    ]
  },
};

// ── DEFAULT DATA — BODYWEIGHT ─────────────────────────────
const DEFAULT_DATA_BW = {
  "Push": {
    groupe: "Push",
    exercises: [
      { id: 101, name: "Dips (sur chaises)",   series: "4", reps: "8–12",       rest: "90 s", notes: "", weights: [] },
      { id: 102, name: "Pike Push-ups",        series: "4", reps: "8–10",       rest: "90 s", notes: "", weights: [] },
      { id: 103, name: "Pompes Déclinées",     series: "4", reps: "12–15",      rest: "90 s", notes: "", weights: [] },
      { id: 104, name: "Pompes Archer",        series: "4", reps: "6–8 / Bras", rest: "90 s", notes: "", weights: [] },
    ]
  },
  "Pull": {
    groupe: "Pull",
    exercises: [
      { id: 106, name: "Tractions",               series: "4", reps: "6–10",   rest: "90 s", notes: "", weights: [] },
      { id: 107, name: "Tractions australiennes", series: "4", reps: "12–15",  rest: "60 s", notes: "", weights: [] },
      { id: 108, name: "Facepull (serviette)",    series: "4", reps: "15–20",  rest: "60 s", notes: "", weights: [] },
      { id: 115, name: "Curl serviette (biceps)", series: "4", reps: "12",     rest: "60 s", notes: "", weights: [] },
    ]
  },
  "Legs / Core": {
    groupe: "Legs / Core",
    exercises: [
      { id: 111, name: "Pistol Squat (assisté)", series: "4", reps: "6–10 / Jambe", rest: "90 s", notes: "", weights: [] },
      { id: 116, name: "Fentes Bulgares",        series: "4", reps: "12/jambe",     rest: "60 s", notes: "", weights: [] },
      { id: 117, name: "Relevé de jambes",       series: "4", reps: "15–20",        rest: "90 s", notes: "", weights: [] },
      { id: 118, name: "Hollow Body Hold",       series: "4", reps: "1 min",        rest: "90 s", notes: "", weights: [] },
    ]
  },
};

// ── PERSISTENCE ──────────────────────────────────────────
function _loadFromStorage(key, fallback) {
  try {
    const ls = localStorage.getItem(key);
    if (ls) return JSON.parse(ls);
    // Legacy migration for gym
    if (key === 'prog_muscu_gym') {
      const legacy = localStorage.getItem('prog_muscu_v2');
      if (legacy) return JSON.parse(legacy);
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(fallback)); // deep clone default
}

function save() {
  try {
    const key = activePage === 'gym' ? 'prog_muscu_gym' : 'prog_muscu_bw';
    localStorage.setItem(key, JSON.stringify(state));
  } catch (e) { console.warn('Save error:', e); }
}

// ── STATE ─────────────────────────────────────────────────
let activePage = localStorage.getItem('muscu_page') || 'gym';

const _stateGym = _loadFromStorage('prog_muscu_gym', DEFAULT_DATA);
const _stateBW  = _loadFromStorage('prog_muscu_bw',  DEFAULT_DATA_BW);
[_stateGym, _stateBW].forEach(st =>
  Object.values(st).forEach(d =>
    d.exercises && d.exercises.forEach(ex => { if (!ex.weights) ex.weights = []; })
  )
);

let state     = activePage === 'gym' ? _stateGym : _stateBW;
let days      = Object.keys(state);
let activeDay = days[0];
let editingId   = null;
let activeTab   = {};
let openDetails = {};
let nextId = Math.max(300,
  ...Object.values(_stateGym).flatMap(d => d.exercises.map(e => e.id)),
  ...Object.values(_stateBW).flatMap(d => d.exercises.map(e => e.id))
) + 1;

// ── PAGE SWITCH ───────────────────────────────────────────
function switchPage(page) {
  if (page === activePage) return;
  activePage = page;
  localStorage.setItem('muscu_page', page);
  state     = activePage === 'gym' ? _stateGym : _stateBW;
  days      = Object.keys(state);
  activeDay = days[0];
  editingId   = null;
  activeTab   = {};
  openDetails = {};
  _chartCache.clear();
  document.getElementById('navGym').classList.toggle('active', page === 'gym');
  document.getElementById('navBW').classList.toggle('active', page === 'bodyweight');
  render();
}

// ── HELPERS ──────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function getLastWeight(ex) {
  if (!ex.weights || !ex.weights.length) return null;
  return ex.weights[ex.weights.length - 1];
}
function findEx(id) {
  return state[activeDay].exercises.find(e => e.id === id) || null;
}
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
const debouncedSave = debounce(save, 400);
 
// ── RENDER ───────────────────────────────────────────────
function render() {
  renderNav();
  renderContent();
  const needsCharts = Object.keys(openDetails).some(id => openDetails[id] && (activeTab[id] || 'settings') === 'weights')
    || (editingId !== null && (activeTab[editingId] || 'settings') === 'weights');
  if (needsCharts) setTimeout(drawCharts, 0);
  setTimeout(initDragDrop, 0);
}
 
function renderNav() {
  const btns = days.map(d => {
    const g = state[d].groupe || d;
    return `<div class="day-btn-wrap">
      <button class="day-btn ${d === activeDay ? 'active' : ''}" data-action="select-day" data-day="${esc(d)}">${esc(g)}</button>
      <span class="day-edit-icon" data-action="edit-day" data-day="${esc(d)}" title="Modifier">&#9998;</span>
    </div>`;
  }).join('');
  const nav = document.getElementById('daysNav');
  nav.style.setProperty('--day-cols', days.length + 1);
  nav.innerHTML = btns + '<button class="add-day-btn" data-action="add-day" title="Ajouter un groupe">+</button>';
}
 
function renderContent() {
  const day = state[activeDay];
  const el  = document.getElementById('content');
 
  if (!day.exercises.length) {
    el.innerHTML = `
      <div class="section-header">
        <span class="section-title">${esc(day.groupe)}</span>
        <span class="section-count">0 exercice</span>
      </div>
      <button class="add-btn" data-action="add-ex">+ Ajouter un exercice</button>`;
    return;
  }
 
  let html = `
    <div class="section-header">
      <span class="section-title">${esc(day.groupe)}</span>
      <span class="section-count">${day.exercises.length} exercice${day.exercises.length > 1 ? 's' : ''}</span>
    </div>
    <button class="start-session-btn" data-action="start-session">Commencer la séance</button>`;
 
  day.exercises.forEach((ex) => {
    const ed      = editingId === ex.id;
    const tab     = activeTab[ex.id] || 'settings';
    const lw      = getLastWeight(ex);
    const lwLabel = lw ? `${lw.weight}` : '—';
    const lwClass = lw ? 'has-data' : '';
    const isOpen  = openDetails[ex.id] || ed;
 
    html += `
    <div class="exercise-card ${ed ? 'editing' : ''} ${isOpen ? 'open' : ''}" id="card-${ex.id}" data-exid="${ex.id}">
      <div class="ex-main" id="main-${ex.id}">
        <div class="ex-left">
          <div class="ex-name">${ed
            ? `<input value="${esc(ex.name)}" data-action="field" data-id="${ex.id}" data-field="name" />`
            : esc(ex.name)
          }</div>
        </div>
        <div class="ex-right">
          <span class="last-weight ${lwClass}" title="Dernier poids">${lwLabel}</span>
          <span class="badge series">${esc(ex.series)}×</span>
          <span class="badge reps">${esc(ex.reps)}</span>
          <span class="badge rest">${esc(ex.rest)}</span>
          <button class="edit-btn" data-action="edit" data-id="${ex.id}" title="${ed ? 'Fermer' : 'Modifier'}">
            ${ed ? '✕' : '✎'}
          </button>
        </div>
      </div>
      ${renderDetails(ex, tab)}
    </div>`;
  });
 
  html += `<button class="add-btn" data-action="add-ex">+ Ajouter un exercice</button>`;
  el.innerHTML = html;
}
 
function renderDetails(ex, tab) {
  const weightRows = (ex.weights || []).map((w, wi) => `
    <div class="weight-entry">
      <input class="date-field" type="date" value="${esc(w.date)}"
        data-action="weight" data-id="${ex.id}" data-wi="${wi}" data-field="date" />
      <input class="notes-mini" placeholder="Notes séance" value="${esc(w.notes || '')}"
        data-action="weight" data-id="${ex.id}" data-wi="${wi}" data-field="notes" />
      <input type="text" placeholder="ex: 80 kg" value="${esc(w.weight)}"
        data-action="weight" data-id="${ex.id}" data-wi="${wi}" data-field="weight" />
      <button class="rm-weight" data-action="rm-weight" data-id="${ex.id}" data-wi="${wi}">×</button>
    </div>`).join('');
 
  const chartHtml = ex.weights && ex.weights.length >= 2
    ? `<div class="progress-chart"><canvas id="chart-${ex.id}" width="480" height="48"></canvas></div>`
    : `<div class="chart-empty">${ex.weights && ex.weights.length === 1
        ? 'Ajoute une 2e séance pour voir la courbe'
        : "Aucune donnée de poids pour l'instant"
      }</div>`;
 
  return `
  <div class="ex-details">
    <div class="ex-details-inner">
    <div class="details-tabs">
      <button class="tab-btn ${tab === 'settings' ? 'active' : ''}" data-action="tab" data-id="${ex.id}" data-tab="settings">Paramètres</button>
      <button class="tab-btn ${tab === 'weights'  ? 'active' : ''}" data-action="tab" data-id="${ex.id}" data-tab="weights">Suivi poids</button>
    </div>
    <div class="tab-panel ${tab === 'settings' ? 'active' : ''}">
      <div class="fields-grid">
        <div class="field-group">
          <label>Séries</label>
          <input value="${esc(ex.series)}" data-action="field" data-id="${ex.id}" data-field="series" />
        </div>
        <div class="field-group">
          <label>Reps</label>
          <input value="${esc(ex.reps)}" data-action="field" data-id="${ex.id}" data-field="reps" />
        </div>
        <div class="field-group">
          <label>Repos</label>
          <input value="${esc(ex.rest)}" data-action="field" data-id="${ex.id}" data-field="rest" />
        </div>
      </div>
      <div class="notes-field">
        <label>Notes / instructions</label>
        <input placeholder="Technique, sensation, charge cible…" value="${esc(ex.notes)}" data-action="field" data-id="${ex.id}" data-field="notes" />
      </div>
      <button class="del-btn" data-action="delete" data-id="${ex.id}">— Supprimer cet exercice</button>
    </div>
    <div class="tab-panel ${tab === 'weights' ? 'active' : ''}">
      ${chartHtml}
      <div class="weight-log">
        ${ex.weights && ex.weights.length ? `
        <div class="weight-log-header">
          <span>Date</span><span>Notes</span><span>Charge</span><span></span>
        </div>` : ''}
        ${weightRows}
      </div>
      <button class="add-weight-btn" data-action="add-weight" data-id="${ex.id}">+ Ajouter une séance</button>
    </div>
  </div></div>`;
}
 
// ── MINI CHART ───────────────────────────────────────────
const _chartCache = new Map(); // id → last drawn data hash

function _hashWeights(weights) {
  return weights.map(w => w.weight).join(',');
}

function drawCharts() {
  const day = state[activeDay];
  if (!day.exercises) return;
  day.exercises.forEach(ex => {
    const isOpen = openDetails[ex.id] || editingId === ex.id;
    if (!isOpen) return;
    if ((activeTab[ex.id] || 'settings') !== 'weights') return;
    if (!ex.weights || ex.weights.length < 2) return;
    const canvas = document.getElementById(`chart-${ex.id}`);
    if (!canvas) return;

    // Skip redraw if data hasn't changed
    const hash = _hashWeights(ex.weights);
    if (_chartCache.get(ex.id) === hash) return;
    _chartCache.set(ex.id, hash);

    const dpr = window.devicePixelRatio || 1;
    const ctx  = canvas.getContext('2d');
    canvas.width  = (canvas.offsetWidth || 480) * dpr;
    canvas.height = 48 * dpr;
    ctx.scale(dpr, dpr);

    const vals = ex.weights.map(w => parseFloat(w.weight)).filter(v => !isNaN(v));
    if (vals.length < 2) return;

    const W     = canvas.offsetWidth || 480, H = 48;
    const min   = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const pts   = vals.map((v, i) => [
      (i / (vals.length - 1)) * (W - 20) + 10,
      H - 8 - ((v - min) / range) * (H - 16),
    ]);

    ctx.clearRect(0, 0, W, H);

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(200,245,53,0.25)');
    grad.addColorStop(1, 'rgba(200,245,53,0.0)');
    ctx.beginPath();
    ctx.moveTo(pts[0][0], H);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(pts[pts.length - 1][0], H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.strokeStyle = '#c8f535';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Batch all dots in a single path instead of one beginPath/fill per dot
    ctx.fillStyle = '#c8f535';
    ctx.beginPath();
    pts.forEach(p => { ctx.moveTo(p[0] + 3, p[1]); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); });
    ctx.fill();
  });
}
 
// ── ACTIONS ──────────────────────────────────────────────
function selectDay(d)    { activeDay = d; editingId = null; render(); }
 
function toggleDetails(id) {
  openDetails[id] = !openDetails[id];
  render();
}
 
function toggleEdit(id) {
  const wasEditing = editingId === id;
  editingId = wasEditing ? null : id;
  if (!wasEditing) {
    openDetails[id] = true;
    if (!activeTab[id]) activeTab[id] = 'settings';
  }
  render();
  if (!wasEditing) {
    setTimeout(() => {
      const input = document.querySelector(`#card-${id} .ex-name input`);
      if (input) input.focus();
    }, 30);
  }
}
 
function setTab(id, tab) {
  activeTab[id] = tab;
  render();
}
 
function updateField(id, field, val) {
  const ex = findEx(id);
  if (!ex) return;
  ex[field] = val;
  debouncedSave();
  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.classList.remove('flash-saved');
    void card.offsetWidth;
    card.classList.add('flash-saved');
    setTimeout(() => card.classList.remove('flash-saved'), 700);
  }
}
 
function addEx() {
  const id = nextId++;
  state[activeDay].exercises.push({ id, name: "Nouvel exercice", series: "3", reps: "10", rest: "60 s", notes: "", weights: [] });
  editingId = id;
  activeTab[id] = 'settings';
  save(); render();
}
 
function deleteEx(id) {
  if (!confirm('Supprimer cet exercice ?')) return;
  state[activeDay].exercises = state[activeDay].exercises.filter(e => e.id !== id);
  editingId = null;
  save(); render();
}
 
function addWeight(exId) {
  const ex = findEx(exId);
  if (!ex) return;
  ex.weights.push({ date: todayStr(), weight: '', notes: '' });
  save(); render();
}
 
function updateWeight(exId, wi, field, val) {
  const ex = findEx(exId);
  if (ex && ex.weights[wi]) { ex.weights[wi][field] = val; debouncedSave(); }
}
 
function removeWeight(exId, wi) {
  const ex = findEx(exId);
  if (ex) { ex.weights.splice(wi, 1); save(); render(); }
}
 
// ── DRAG AND DROP ────────────────────────────────────────
let dragSrcId    = null;
let _lastDragOver = null;
 
function initDragDrop() {
  document.querySelectorAll('.exercise-card').forEach(card => {
    const id       = +card.dataset.exid;
    const mainZone = card.querySelector('.ex-main');
 
    // ── Desktop: click to toggle, mousedown to drag ──
    let didDrag = false;
    if (mainZone) {
      mainZone.addEventListener('click', e => {
        if (e.target.closest('button, input, a')) return;
        if (didDrag) { didDrag = false; return; } // ignore click after drag
        toggleDetails(id);
      });
      mainZone.addEventListener('mousedown', e => {
        if (e.target.closest('button, input, a')) return;
        card.setAttribute('draggable', 'true');
      });
      mainZone.addEventListener('mouseup', () => {
        card.setAttribute('draggable', 'false');
      });
    }
 
    card.addEventListener('dragstart', e => {
      if (e.target.closest('button, input, a')) { e.preventDefault(); return; }
      didDrag   = true;
      dragSrcId = id;
      card.classList.add('drag-lifted');
      setTimeout(() => {
        card.classList.remove('drag-lifted');
        card.classList.add('dragging');
      }, 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging', 'drag-lifted');
      card.setAttribute('draggable', 'false');
      if (_lastDragOver) { _lastDragOver.classList.remove('drag-over'); _lastDragOver = null; }
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (id !== dragSrcId) {
        if (_lastDragOver && _lastDragOver !== card) _lastDragOver.classList.remove('drag-over');
        card.classList.add('drag-over');
        _lastDragOver = card;
      }
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (dragSrcId === null || dragSrcId === id) return;
      const exs     = state[activeDay].exercises;
      const fromIdx = exs.findIndex(e => e.id === dragSrcId);
      const toIdx   = exs.findIndex(e => e.id === id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = exs.splice(fromIdx, 1);
      exs.splice(toIdx, 0, moved);
      dragSrcId = null;
      save(); render();
    });
 
    // ── Mobile: tap to toggle, long-press to drag ──
    let touchStartX = 0, touchStartY = 0;
    let touchMoved  = false;
    let holdTimer   = null;
    let isDragging  = false;
 
    if (mainZone) {
      mainZone.addEventListener('touchstart', e => {
        if (e.target.closest('button, input, a')) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMoved  = false;
        isDragging  = false;
 
        holdTimer = setTimeout(() => {
          if (touchMoved) return; // finger moved — not a long press
          isDragging = true;
          dragSrcId  = id;
          card.classList.add('drag-lifted');
          setTimeout(() => {
            if (isDragging) {
              card.classList.remove('drag-lifted');
              card.classList.add('dragging');
            }
          }, 150);
        }, 200);
      }, { passive: true });
    }
 
    card.addEventListener('touchmove', e => {
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > 6 || dy > 6) {
        touchMoved = true;
        if (!isDragging) {
          // Not yet dragging — cancel hold timer, let scroll happen
          clearTimeout(holdTimer);
          holdTimer = null;
          return;
        }
      }
      if (!isDragging) return;
      e.preventDefault();
      const touch  = e.touches[0];
      const els    = document.elementsFromPoint(touch.clientX, touch.clientY);
      const target = els.find(el => el.classList.contains('exercise-card') && el !== card);
      document.querySelectorAll('.exercise-card').forEach(c => c.classList.remove('drag-over'));
      if (target) target.classList.add('drag-over');
    }, { passive: false });
 
    card.addEventListener('touchend', e => {
      clearTimeout(holdTimer);
      holdTimer = null;
 
      if (isDragging) {
        // End of drag
        card.classList.remove('dragging', 'drag-lifted');
        const touch  = e.changedTouches[0];
        const els    = document.elementsFromPoint(touch.clientX, touch.clientY);
        const target = els.find(el => el.classList.contains('exercise-card') && el !== card);
        document.querySelectorAll('.exercise-card').forEach(c => c.classList.remove('drag-over'));
        if (target) {
          const targetId = +target.dataset.exid;
          const exs      = state[activeDay].exercises;
          const fromIdx  = exs.findIndex(e => e.id === dragSrcId);
          const toIdx    = exs.findIndex(e => e.id === targetId);
          if (fromIdx >= 0 && toIdx >= 0 && fromIdx !== toIdx) {
            const [moved] = exs.splice(fromIdx, 1);
            exs.splice(toIdx, 0, moved);
            save(); render();
          }
        }
        isDragging = false;
        dragSrcId  = null;
      } else if (!touchMoved) {
        // It was a tap — toggle details
        const tgt = e.target;
        if (!tgt.closest('button, input, a')) toggleDetails(id);
      }
    });
  });
}
 
 
// ── KEYBOARD SHORTCUTS ───────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (DOM.sessionOverlay.style.display !== 'none') { closeSession(); return; }
    if (document.getElementById('dayModal').style.display !== 'none') { document.getElementById('dayModal').style.display = 'none'; return; }
    if (editingId !== null) { editingId = null; render(); }
  }
});

// ── EVENT DELEGATION ────────────────────────────────────
document.addEventListener('click', e => {
  const el  = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id     = el.dataset.id ? parseInt(el.dataset.id) : null;
 
  if (action === 'select-day')   { selectDay(el.dataset.day); return; }
  if (action === 'edit-day')     { openDayModal(el.dataset.day); return; }
  if (action === 'add-day')      { openAddDayModal(); return; }
  if (action === 'start-session'){ startSession(); return; }
  if (action === 'add-ex')       { addEx(); return; }
  if (action === 'edit')         { e.stopPropagation(); toggleEdit(id); return; }
  if (action === 'tab')          { e.stopPropagation(); setTab(id, el.dataset.tab); return; }
  if (action === 'delete')       { e.stopPropagation(); deleteEx(id); return; }
  if (action === 'add-weight')   { e.stopPropagation(); addWeight(id); return; }
  if (action === 'rm-weight')    { e.stopPropagation(); removeWeight(id, parseInt(el.dataset.wi)); return; }
});
 
document.addEventListener('input', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id     = parseInt(el.dataset.id);
  if (action === 'field')  { updateField(id, el.dataset.field, el.value); return; }
  if (action === 'weight') { updateWeight(id, parseInt(el.dataset.wi), el.dataset.field, el.value); return; }
});
 
document.addEventListener('change', e => {
  const el = e.target.closest('[data-action="weight"]');
  if (!el || el.dataset.field !== 'date') return;
  updateWeight(parseInt(el.dataset.id), parseInt(el.dataset.wi), 'date', el.value);
});
 
// ── DAY MANAGEMENT ───────────────────────────────────────
let dayModalMode   = null;
let dayModalTarget = null;
 
function openDayModal(dayName) {
  dayModalMode   = 'edit';
  dayModalTarget = dayName;
  document.getElementById('dayModalTitle').textContent    = 'Modifier — ' + dayName;
  document.getElementById('dayModalName').value           = dayName;
  document.getElementById('dayModalSepDel').style.display = '';
  document.getElementById('dayModalDelRow').style.display = '';
  document.getElementById('dayModal').style.display       = 'flex';
  setTimeout(() => document.getElementById('dayModalName').select(), 50);
}
 
function openAddDayModal() {
  dayModalMode   = 'add';
  dayModalTarget = null;
  document.getElementById('dayModalTitle').textContent    = 'Ajouter un groupe';
  document.getElementById('dayModalName').value           = '';
  document.getElementById('dayModalSepDel').style.display = 'none';
  document.getElementById('dayModalDelRow').style.display = 'none';
  document.getElementById('dayModal').style.display       = 'flex';
  setTimeout(() => document.getElementById('dayModalName').focus(), 50);
}
 
function closeDayModal(e) {
  if (e && e.target !== document.getElementById('dayModal')) return;
  document.getElementById('dayModal').style.display = 'none';
}
 
function saveDayModal() {
  const newName = document.getElementById('dayModalName').value.trim();
  if (!newName) return;

  if (dayModalMode === 'add') {
    if (state[newName]) { alert('Ce groupe existe déjà.'); return; }
    state[newName] = { groupe: newName, exercises: [] };
    days.push(newName);
    activeDay = newName;
  } else {
    if (newName !== dayModalTarget) {
      if (state[newName]) { alert('Ce nom est déjà utilisé.'); return; }
      const newState = {};
      days.forEach((d, i) => {
        if (d === dayModalTarget) { newState[newName] = state[d]; days[i] = newName; }
        else { newState[d] = state[d]; }
      });
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, newState);
      if (activeDay === dayModalTarget) activeDay = newName;
    }
    state[newName].groupe = newName;
  }

  save();
  document.getElementById('dayModal').style.display = 'none';
  render();
}
 
function deleteDayModal() {
  if (days.length <= 1) { alert('Il faut au moins un groupe.'); return; }
  if (!confirm('Supprimer ce groupe et tous ses exercices ?')) return;
  const idx = days.indexOf(dayModalTarget);
  days.splice(idx, 1);
  delete state[dayModalTarget];
  if (activeDay === dayModalTarget) activeDay = days[Math.max(0, idx - 1)];
  save();
  document.getElementById('dayModal').style.display = 'none';
  render();
}
 
// ── SESSION MODE ─────────────────────────────────────────
let sessionExIdx   = 0;
let sessionExs     = [];
let timerInterval  = null;
let timerTotal     = 0;
let timerRemaining = 0;
let sessionSeriesDone = 0;

function updateSeriesCounter() {
  const ex        = sessionExs[sessionExIdx];
  const total     = parseInt(ex.series) || 4;
  const done      = sessionSeriesDone;
  const dots      = document.getElementById('seriesDots');
  const label     = document.getElementById('seriesCounterLabel');
  dots.innerHTML  = Array.from({ length: total }, (_, i) =>
    `<div class="series-dot ${i < done ? 'done' : ''}"></div>`
  ).join('');
  label.textContent = `${done} / ${total} séries`;
}
 
const _restCache = new Map();
function parseRestSeconds(restStr) {
  if (!restStr) return 60;
  if (_restCache.has(restStr)) return _restCache.get(restStr);
  const s        = restStr.toLowerCase();
  const minMatch = s.match(/(\d+)\s*min/);
  const secMatch = s.match(/(\d+)\s*s\b/);
  let total = 0;
  if (minMatch) total += parseInt(minMatch[1]) * 60;
  if (secMatch) total += parseInt(secMatch[1]);
  const result = total || 60;
  _restCache.set(restStr, result);
  return result;
}
 
function startSession() {
  sessionExs = state[activeDay].exercises;
  if (!sessionExs.length) return;
  sessionExIdx = 0;
  stopTimer();
  DOM.sessionOverlay.style.display = 'flex';
  renderSessionEx();
}
 
function closeSession() {
  stopTimer();
  DOM.sessionOverlay.style.display = 'none';
}
 
function renderSessionEx() {
  const ex    = sessionExs[sessionExIdx];
  const total = sessionExs.length;
  const next  = sessionExs[sessionExIdx + 1];
 
  DOM.sessionDayTitle.textContent  = state[activeDay].groupe;
  DOM.sessionExNum.textContent     = `Exercice ${sessionExIdx + 1} / ${total}`;
  DOM.sessionExName.textContent    = ex.name;
  // Step dots
  DOM.sessionSteps.innerHTML = sessionExs.map((_, i) =>
    `<div class="session-step ${i < sessionExIdx ? 'done' : i === sessionExIdx ? 'current' : ''}"></div>`
  ).join('');
 
  DOM.sessionBadges.innerHTML =
    `<span class="session-badge series">${esc(ex.series)} séries</span>
     <span class="session-badge reps">${esc(ex.reps)} rép</span>
     <span class="session-badge rest">${esc(ex.rest)}</span>`;
  DOM.sessionNotes.textContent = ex.notes || '';
 
  // Next exercise
  const nextEl = DOM.sessionNextEx;
  nextEl.innerHTML = next ? `Ensuite : <span>${esc(next.name)}</span>` : '';
 
  DOM.sessionNextBtn.textContent = sessionExIdx < total - 1 ? 'Suivant →' : '✓ Terminer';
  DOM.sessionPrevBtn.disabled    = sessionExIdx === 0;
  stopTimer();
  sessionSeriesDone = 0;
  updateSeriesCounter();
  showTimerIdle();
}
 
function showTimerIdle() {
  DOM.timerRing.style.display     = 'none';
  DOM.timerIdle.style.display     = '';
  DOM.sessionTimerBtn.textContent = '⏱ Lancer le repos';
}
 
function startRestTimer() {
  const secs = parseRestSeconds(sessionExs[sessionExIdx].rest);
  stopTimer();
  timerTotal     = secs;
  timerRemaining = secs;
  sessionSeriesDone++;
  updateSeriesCounter();

  const ex       = sessionExs[sessionExIdx];
  const total    = parseInt(ex.series) || 4;
  const isLast   = sessionSeriesDone >= total;

  DOM.timerRing.style.display     = '';
  DOM.timerIdle.style.display     = 'none';
  DOM.sessionTimerBtn.textContent = '⏹ Arrêter';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      stopTimer();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      if (isLast) {
        sessionNext();
      } else {
        DOM.timerCount.textContent = 'Go!';
      }
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  DOM.timerCount.textContent = `${m}:${String(s).padStart(2, '0')}`;
  const circumference = 2 * Math.PI * 64;
  const offset = circumference * (1 - timerRemaining / timerTotal);
  DOM.timerCircle.style.strokeDashoffset = offset;
}
 
function handleTimerBtn() {
  if (timerInterval) stopTimer();
  else startRestTimer();
}
 
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  showTimerIdle();
}
 
function sessionNext() {
  if (sessionExIdx < sessionExs.length - 1) {
    sessionExIdx++;
    renderSessionEx();
  } else {
    closeSession();
  }
}
 
function sessionPrev() {
  if (sessionExIdx > 0) { sessionExIdx--; renderSessionEx(); }
}
 
// ── THEME ────────────────────────────────────────────────
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('muscu_theme', isDark ? 'dark' : 'light');
}
 
(function () {
  const saved = localStorage.getItem('muscu_theme');
  if (saved === 'dark') {
    document.documentElement.classList.add('dark');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️';
  }
})();
 
// ── INIT ─────────────────────────────────────────────────
render();
// Sync bottom nav active state with saved page
document.getElementById('navGym').classList.toggle('active', activePage === 'gym');
document.getElementById('navBW').classList.toggle('active', activePage === 'bodyweight');

// Cache session overlay DOM refs (queried repeatedly during timer ticks)
const DOM = {
  sessionOverlay:   document.getElementById('sessionOverlay'),
  sessionDayTitle:  document.getElementById('sessionDayTitle'),
  sessionExNum:     document.getElementById('sessionExNum'),
  sessionExName:    document.getElementById('sessionExName'),
  sessionSteps:     document.getElementById('sessionSteps'),
  sessionBadges:    document.getElementById('sessionBadges'),
  sessionNotes:     document.getElementById('sessionNotes'),
  sessionNextEx:    document.getElementById('sessionNextEx'),
  sessionNextBtn:   document.getElementById('sessionNextBtn'),
  sessionPrevBtn:   document.getElementById('sessionPrevBtn'),
  sessionTimerBtn:  document.getElementById('sessionTimerBtn'),
  timerRing:        document.getElementById('timerRing'),
  timerIdle:        document.getElementById('timerIdle'),
  timerCount:       document.getElementById('timerCount'),
  timerCircle:      document.getElementById('timerCircle'),
  seriesDots:       document.getElementById('seriesDots'),
  seriesLabel:      document.getElementById('seriesCounterLabel'),
};
 
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
